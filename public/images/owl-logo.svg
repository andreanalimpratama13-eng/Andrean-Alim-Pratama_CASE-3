<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
    <title id="title">Burung hantu cokelat</title>
    <style>
        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-1.5px); }
        }

        @keyframes blink {
            0%, 43%, 47%, 100% { transform: scaleY(1); }
            44%, 46% { transform: scaleY(0.08); }
        }

        @keyframes wing {
            0%, 100% { transform: rotate(0); }
            50% { transform: rotate(5deg); }
        }

        .owl { animation: bob 3s ease-in-out infinite; transform-origin: center; }
        .eyes { animation: blink 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
        .wing-left { animation: wing 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
        .wing-right { animation: wing 2.4s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: left center; }

        @media (prefers-reduced-motion: reduce) {
            .owl, .eyes, .wing-left, .wing-right { animation: none; }
        }
    </style>
    <g class="owl">
        <path d="M12 25 8 7l17 11M52 25l4-18-17 11" fill="#70472f" stroke="#573621" stroke-linejoin="round" stroke-width="2"/>
        <path d="M10 31c0-14 9-23 22-23s22 9 22 23v12c0 11-10 18-22 18S10 54 10 43z" fill="#8b5e3c"/>
        <path class="wing-left" d="M13 30c-7 4-9 12-6 20l11 3 8-11-3-13z" fill="#70472f" stroke="#573621" stroke-linejoin="round" stroke-width="1.5"/>
        <path class="wing-right" d="M51 30c7 4 9 12 6 20l-11 3-8-11 3-13z" fill="#70472f" stroke="#573621" stroke-linejoin="round" stroke-width="1.5"/>
        <path d="M12 31c0-11 9-17 20-17s20 6 20 17c0 12-8 20-20 20S12 43 12 31" fill="#e8c99e"/>
        <g class="eyes">
            <circle cx="23" cy="31" r="8" fill="#fff5df"/>
            <circle cx="41" cy="31" r="8" fill="#fff5df"/>
            <circle cx="24" cy="32" r="4" fill="#382619"/>
            <circle cx="40" cy="32" r="4" fill="#382619"/>
            <circle cx="25" cy="30.5" r="1.3" fill="#fff"/>
            <circle cx="41" cy="30.5" r="1.3" fill="#fff"/>
        </g>
        <path d="m32 35-4 6h8z" fill="#d89436" stroke="#a86422" stroke-linejoin="round" stroke-width="1"/>
        <path d="M25 57 23 61m16-4 2 4" fill="none" stroke="#d89436" stroke-linecap="round" stroke-width="3"/>
    </g>
</svg>
